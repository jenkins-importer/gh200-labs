   name: 'Setup Build Environment'
   description: 'Sets up Node.js and restores the npm cache'
   inputs:
     node-version:
       description: 'Node.js version'
       required: false
       default: '22'
   outputs:
     cache-hit:
       description: 'true when the npm cache was restored from an exact key match'
       value: ${{ steps.cache.outputs.cache-hit }}
   runs:
     using: 'composite'
     steps:
       - name: Setup Node.js
         uses: actions/setup-node@v7
         with:
           node-version: ${{ inputs.node-version }}
       - name: Cache npm
         id: cache
         uses: actions/cache@v6
         with:
           path: ~/.npm
           key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
           restore-keys: |
             ${{ runner.os }}-${{ runner.arch }}-npm-