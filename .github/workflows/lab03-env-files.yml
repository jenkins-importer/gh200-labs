name: Lab 03 - Step Environment Files

on:
  workflow_dispatch:
  push:

jobs:
  pass-data:
    runs-on: ubuntu-latest
    steps:
      - name: Capture commit info and timestamp
        id: info
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          BUILD_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=$BUILD_TS" >> "$GITHUB_OUTPUT"

      - name: Set environment variable
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          echo "BUILD_ID=build-${RUN_NUM}" >> "$GITHUB_ENV"

      - name: Print captured variables
        env:
          COMMIT_SHA: ${{ steps.info.outputs.short_sha }}
          TIMESTAMP: ${{ steps.info.outputs.build_timestamp }}
        run: |
          echo "Commit SHA: $COMMIT_SHA"
          echo "Build ID: $BUILD_ID"
          echo "Timestamp: $TIMESTAMP"

      - name: Capture multi-line report
        id: report
        run: |
          DELIMITER=$(openssl rand -hex 8)
          {
            echo "summary<<${DELIMITER}"
            echo "Line 1: Build execution completed successfully"
            echo "Line 2: Unit test coverage met target (85%)"
            echo "Line 3: Zero critical vulnerabilities detected"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Print multi-line report
        env:
          REPORT_TEXT: ${{ steps.report.outputs.summary }}
        run: echo "$REPORT_TEXT"