name: Lab 8 - Artifact Attestation

on:
  workflow_dispatch:

permissions: {}

jobs:
  attest-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create build tarball
        run: tar -czf build-output.tar.gz .github/workflows/lab10-attestation.yml

      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'build-output.tar.gz'

      - name: Store attestation bundle alongside artifact
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" provenance.sigstore.json

      - name: Upload artifact package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: |
            build-output.tar.gz
            provenance.sigstore.json

      - name: Verify artifact attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify build-output.tar.gz --repo "${GITHUB_REPOSITORY}"