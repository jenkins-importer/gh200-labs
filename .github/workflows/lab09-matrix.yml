# .github/workflows/matrix-ci.yml
name: Advanced Matrix CI Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Enables manual triggering from the UI

jobs:
  validate-and-test:
    # 2. Correlating Job Names to Matrix Axes
    # Explicit mapping creates highly scannable, human-readable labels in the UI dashboard.
    name: Test
    runs-on: ${{ matrix.os }}

    strategy:
      # 1. Interpreting Matrix Expansions
      # Combines 2 Operating Systems × 3 Node Versions × 2 Databases = 12 total unique jobs.
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]
        database: [postgres, mongodb]
        
      # CRITICAL FOR FAILURE ANALYSIS:
      # Setting fail-fast to false ensures that if one combination (e.g., Windows/Node 18/MongoDB) fails,
      # the other 11 jobs continue running. This provides the full picture to spot matrix failure patterns.
      fail-fast: false

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Project Dependencies
        run: npm ci

      - name: Spin up Test Database
        # Uses matrix dimensions to pass environmental parameters unique to each run
        run: |
          echo "Initializing ${{ matrix.database }} cluster on Host OS: ${{ matrix.os }}"
          npm run db:setup -- --type=${{ matrix.database }}

      - name: Execute Test Suite
        run: npm run test:ci

      - name: Upload Logs on Failure
        # 3. Analyzing Failures Across Variants
        # Generates uniquely named bug reports so you can tell if a defect is isolated to one environment.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-node-${{ matrix.node-version }}-${{ matrix.database }}
          path: ./logs/
