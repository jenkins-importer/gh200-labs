name: Lab 09 - Matrix

on:
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node-version }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        node-version: [20, 22, 24]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - node-version: 24
            runner: ubuntu-latest
            primary: true
        exclude:
          - node-version: 20
            runner: ubuntu-24.04-arm
    steps:
      - name: Print matrix context
        env:
          MATRIX_JSON: ${{ toJson(matrix) }}
          JOB_INDEX: ${{ strategy.job-index }}
          JOB_TOTAL: ${{ strategy.job-total }}
        run: |
          echo "Matrix Context: $MATRIX_JSON"
          echo "Leg Index: $JOB_INDEX"
          echo "Total Legs: $JOB_TOTAL"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check Node version and architecture
        run: |
          node --version
          echo "Architecture: $RUNNER_ARCH"

      - name: Primary-only execution
        if: ${{ matrix.primary == true }}
        run: echo "Executing exclusive primary leg verification step."

  summary:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !cancelled() }}
    steps:
      - name: Publish matrix summary report
        env:
          OVERALL_RESULT: ${{ needs.test.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🏁 Matrix Strategy Summary

          * **Overall Result:** \`$OVERALL_RESULT\`
          * **Total Executed Legs:** 5
          * **Re-run command for failed legs:**
          \`\`\`bash
          gh run rerun $RUN_ID --failed
          \`\`\`
          EOF