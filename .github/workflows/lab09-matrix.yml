name: "Lab 12 - Advanced Matrix & Failure Analysis"

on:
  workflow_dispatch:
    inputs:
      target_failure:
        description: "Select which matrix variant to intentionally fail"
        type: choice
        default: "none"
        options:
          - "none"
          - "windows-node20"
          - "edge-node24"
          - "all-node18"

permissions:
  contents: read
  actions: read

jobs:
  # ===========================================================================
  # JOB 1: Multi-Axis Matrix Execution
  # ===========================================================================
  matrix-test:
    # -------------------------------------------------------------------------
    # Competency 2: Correlate Job Names to Matrix Axes
    # Explicitly maps each matrix dimension into the workflow run tree
    # -------------------------------------------------------------------------
    name: "Variant [OS: ${{ matrix.os }} | Node: ${{ matrix.node }} | Tier: ${{ matrix.tier || 'standard' }}]"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    # -------------------------------------------------------------------------
    # Competency 1: Interpret Matrix Expansions
    # Math:
    #   Base Cartesian product : 2 OS (ubuntu, windows) * 3 Nodes (18, 20, 22) = 6 legs
    #   Exclude               : (windows, node 18)                            = -1 leg
    #   Include (Augmenting)  : (ubuntu, node 22) -> adds tier: 'primary'     = +0 legs (augments existing)
    #   Include (Appending)   : (ubuntu, node 24) -> adds new variant         = +1 leg  (creates 6th leg)
    #   Total Expanded Legs   : 6 - 1 + 1 = 6 Legs
    # -------------------------------------------------------------------------
    strategy:
      fail-fast: false # Competency 3: Prevent one failure from cancelling others
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
        include:
          # Case A: Matches existing combination -> AUGMENTS it with an extra variable
          - os: ubuntu-latest
            node: 22
            tier: "primary"
          # Case B: Introduces non-existent combination -> APPENDS an entirely new leg
          - os: ubuntu-latest
            node: 24
            tier: "edge"
        exclude:
          # Case C: Removes matching combination from Cartesian product
          - os: windows-latest
            node: 18

    steps:
      # Step 1: Context & Axis Correlation
      - name: Correlate axes and runner metadata
        env:
          MATRIX_CONTEXT: ${{ toJson(matrix) }}
          JOB_INDEX: ${{ strategy.job-index }}
          JOB_TOTAL: ${{ strategy.job-total }}
          AXIS_OS: ${{ matrix.os }}
          AXIS_NODE: ${{ matrix.node }}
          AXIS_TIER: ${{ matrix.tier || 'standard' }}
        run: |
          echo "=== 🧭 Matrix Axis Correlation ==="
          echo "Declared Matrix Context: $MATRIX_CONTEXT"
          echo "Leg Index: $JOB_INDEX of $JOB_TOTAL"
          echo "-------------------------------------"
          echo "Axis OS: $AXIS_OS | Actual Runner OS: $RUNNER_OS"
          echo "Axis Node: $AXIS_NODE"
          echo "Axis Tier: $AXIS_TIER"

      # Step 2: Setup Language Runtime
      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Verify runtime version
        run: |
          echo "Resolved Node Version: $(node --version)"
          echo "Runner Architecture: $RUNNER_ARCH"

      # Step 3: Competency 3 - Intentional Failure Injection Across Variants
      - name: Execute build test and evaluate variant stability
        env:
          FAILURE_TARGET: ${{ inputs.target_failure }}
          CURRENT_OS: ${{ matrix.os }}
          CURRENT_NODE: ${{ matrix.node }}
          CURRENT_TIER: ${{ matrix.tier || 'standard' }}
        run: |
          echo "Testing variant stability..."

          # Variant Failure Condition 1: Windows + Node 20
          if [ "$FAILURE_TARGET" = "windows-node20" ] && [ "$RUNNER_OS" = "Windows" ] && [ "$CURRENT_NODE" = "20" ]; then
            echo "::error title=Variant Failure Detected::Simulated failure on [Windows-latest + Node 20]!"
            exit 1
          fi

          # Variant Failure Condition 2: Edge Tier (Ubuntu + Node 24)
          if [ "$FAILURE_TARGET" = "edge-node24" ] && [ "$CURRENT_TIER" = "edge" ]; then
            echo "::error title=Variant Failure Detected::Simulated failure on Edge tier [Ubuntu + Node 24]!"
            exit 1
          fi

          # Variant Failure Condition 3: All Node 18 variants
          if [ "$FAILURE_TARGET" = "all-node18" ] && [ "$CURRENT_NODE" = "18" ]; then
            echo "::error title=Variant Failure Detected::Simulated failure across all Node 18 legs!"
            exit 1
          fi

          echo "✅ Variant verification passed successfully."

  # ===========================================================================
  # JOB 2: Matrix Analyzer, Diagnostic Collector & Selective Rerun Generator
  # ===========================================================================
  matrix-analyzer:
    name: "Matrix Diagnostics & Rerun Assistant"
    runs-on: ubuntu-latest
    needs: matrix-test
    if: always() # Must execute even when matrix legs fail
    steps:
      - name: Analyze matrix execution and g