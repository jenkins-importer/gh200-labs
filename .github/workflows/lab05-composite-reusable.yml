name: Lab 05 - Composite Action and Reusable Workflow

on:
  push:
  workflow_dispatch:

jobs:
  use-composite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Call composite greeting action
        id: greet
        uses: ./.github/actions/lab05-greet
        with:
          who: 'kk-200'

      - name: Display greeting output
        env:
          OUTPUT_MSG: ${{ steps.greet.outputs.message }}
        run: echo "$OUTPUT_MSG"

  use-reusable:
    uses: ./.github/workflows/lab05-reusable.yml
    with:
      environment-name: 'production'

  show-result:
    runs-on: ubuntu-latest
    needs: use-reusable
    steps:
      - name: Print reusable workflow result
        env:
          RESULT_OUTPUT: ${{ needs.use-reusable.outputs.result }}
        run: echo "$RESULT_OUTPUT"