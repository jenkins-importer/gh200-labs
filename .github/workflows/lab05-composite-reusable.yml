name: Lab 05 - Composite Action and Reusable Workflow

on:
  push:
  workflow_dispatch:

jobs:
    use-reusable:
        uses: ./.github/workflows/lab05-reusable.yml
        with:
            node-version: '20'
        secrets:
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    test-composite-action:
        runs-on: ubuntu-slim
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/lab05-greet
              with:
                environment: 'PRODUCTION'