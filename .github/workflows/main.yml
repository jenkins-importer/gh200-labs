name: GH-200 Sequential Workflow

on:
  push:
    branches: &main_branches
      - main
  pull_request:
    branches: *main_branches
  workflow_dispatch:

env:
  NODE_ENV: test
  API_URL: https://api.example.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci