name: GH-200 Sequential Workflow

on:
  push:
    branches: &main_branches
      - main
  pull_request:
    branches: *main_branches
  workflow_dispatch:

env:
  NODE_ENV: test
  API_URL: https://api.example.com

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Inspect runner environment
        run: |
          echo "Runner OS:   $RUNNER_OS"
          echo "Runner Arch: $RUNNER_ARCH"
          echo "Image:       ${ImageOS:-n/a} ${ImageVersion:-n/a}"
          echo "Tool cache:  $RUNNER_TOOL_CACHE"
          echo "Preinstalled tools:"
          ls "$RUNNER_TOOL_CACHE"
          if [ "$RUNNER_OS" = "Linux" ]; then
            grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup build environment
        id: setup
        uses: ./.github/actions/setup-build-env
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Report npm cache status
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          echo "npm cache exact hit: ${CACHE_HIT:-false}"

      - name: Capture version to GITHUB_OUTPUT
        id: pkg
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set environment variable
        run: echo "BUILD_ID=build-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Use captured values
        env:
          APP_VERSION: ${{ steps.pkg.outputs.version }}
          BUILD_TS: ${{ steps.pkg.outputs.build_timestamp }}
        run: |
          echo "App version: $APP_VERSION"
          echo "Build ID: $BUILD_ID"
          echo "Build timestamp: $BUILD_TS"

      - name: Capture multiline output
        id: summary
        run: |
          delimiter="ghadelimiter_$(openssl rand -hex 8)"
          {
            echo "report<<${delimiter}"
            echo "Workflow Status: In Progress"
            echo "Tests: Pending"
            echo "Coverage: Pending"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Display multiline output
        env:
          REPORT: ${{ steps.summary.outputs.report }}
        run: echo "$REPORT"

      - name: Run unit tests
        id: tests
        run: npm test

      - name: Generate test summary
        if: ${{ !cancelled() }}
        env:
          APP_VERSION: ${{ steps.pkg.outputs.version }}
          BUILD_TS: ${{ steps.pkg.outputs.build_timestamp }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          {
            echo "## 📋 Test Report"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Build ID | $BUILD_ID |"
            echo "| Version | $APP_VERSION |"
            echo "| Timestamp | $BUILD_TS |"
            echo "| Unit tests | $TEST_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo ""
            echo "## 📊 Coverage Report (sample values)"
            echo ""
            echo "| Coverage Type | Percentage |"
            echo "| --- | --- |"
            echo "| Statements | 85% |"
            echo "| Branches | 78% |"
            echo "| Functions | 92% |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Request and decode OIDC token
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC endpoint found. Does this job have 'id-token: write'?"
            exit 1
          fi
          RESPONSE=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          TOKEN=$(echo "$RESPONSE" | jq -r '.value')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::OIDC response did not contain a token."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "Token received (length: ${#TOKEN})"
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "Token claims:"
          echo "$PAYLOAD" | base64 -d | jq '{iss, aud, sub, repository, ref, sha, actor, workflow, job_workflow_ref}'

  coverage:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-coverage.yml
    with:
      node-version: '22'