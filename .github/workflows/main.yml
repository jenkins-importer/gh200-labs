name: GH-200 Sequential Workflow

on:
  push:
    branches: &main_branches
      - main
  pull_request:
    branches: *main_branches
  workflow_dispatch:

env:
  NODE_ENV: test
  API_URL: https://api.example.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture version to GITHUB_OUTPUT
        id: pkg
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set environment variable
        run: echo "BUILD_ID=build-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Use captured values
        env:
          APP_VERSION: ${{ steps.pkg.outputs.version }}
          BUILD_TS: ${{ steps.pkg.outputs.build_timestamp }}
        run: |
          echo "App version: $APP_VERSION"
          echo "Build ID: $BUILD_ID"
          echo "Build timestamp: $BUILD_TS"

      - name: Capture multiline output
        id: summary
        run: |
          delimiter="ghadelimiter_$(openssl rand -hex 8)"
          {
            echo "report<<${delimiter}"
            echo "Workflow Status: In Progress"
            echo "Tests: Pending"
            echo "Coverage: Pending"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Display multiline output
        env:
          REPORT: ${{ steps.summary.outputs.report }}
        run: echo "$REPORT"

      - name: Run unit tests
        id: tests
        run: npm test

      - name: Generate test summary
        if: ${{ !cancelled() }}
        env:
          APP_VERSION: ${{ steps.pkg.outputs.version }}
          BUILD_TS: ${{ steps.pkg.outputs.build_timestamp }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          {
            echo "## 📋 Test Report"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Build ID | $BUILD_ID |"
            echo "| Version | $APP_VERSION |"
            echo "| Timestamp | $BUILD_TS |"
            echo "| Unit tests | $TEST_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo ""
            echo "## 📊 Coverage Report (sample values)"
            echo ""
            echo "| Coverage Type | Percentage |"
            echo "| --- | --- |"
            echo "| Statements | 85% |"
            echo "| Branches | 78% |"
            echo "| Functions | 92% |"
          } >> "$GITHUB_STEP_SUMMARY"