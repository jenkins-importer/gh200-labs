name: Lab 06 - Toolcache and Caching

on:
  workflow_dispatch:

jobs:
  cache-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inspect runner environment and toolcache
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Arch: $RUNNER_ARCH"
          echo "Image OS: $ImageOS"
          echo "Image Version: $ImageVersion"
          echo "Tool Cache Path: $RUNNER_TOOL_CACHE"
          echo "Preinstalled tools:"
          ls -la "$RUNNER_TOOL_CACHE"

      - name: Cache test directory
        id: cache-step
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/lab06-cache
          key: ${{ runner.os }}-lab06-${{ hashFiles('.github/workflows/lab06-toolcache-cache.yml') }}

      - name: Populate cache directory on miss
        if: steps.cache-step.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/lab06-cache
          date -u +%Y-%m-%dT%H:%M:%SZ > ~/lab06-cache/timestamp.txt

      - name: Verify cache result
        env:
          CACHE_HIT: ${{ steps.cache-step.outputs.cache-hit }}
        run: |
          echo "Exact cache hit: ${CACHE_HIT:-false}"
          echo "Stored timestamp: $(cat ~/lab06-cache/timestamp.txt)"